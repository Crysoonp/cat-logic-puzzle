<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Cat Logic Puzzle Ver.0.3.4</title><link rel="stylesheet" href="style.css"></head><body>
<main class="app"><header><div><small>TEKO GAMES</small><h1>Cat Logic Puzzle</h1><p>Ver.0.3.4 prototype</p></div><div class="head-actions"><button id="debugOpen" class="debug-mini">DEBUG</button><button id="historyBtn" class="history-top hidden">過去ステージ</button><div class="stagebox"><b id="stageLabel">STAGE 1</b><span id="scoreLabel">100点</span></div></div></header>
<section id="talk" class="talk left"><span id="talkFace" class="face">🐱</span><div class="bubble"><b id="talkName">にゃんこ爺さん</b><p id="talkText"></p></div></section>
<section id="panel" class="panel"><div class="meta"><div id="lifeBox"></div><div class="marks"><label>MARK</label><button id="modeX" class="active">×</button><button id="modeQ">？</button><button id="modeT" class="hidden">△</button></div></div><div id="coordTop" class="coord-top"></div><div class="boardrow"><div id="coordSide" class="coord-side"></div><div id="board" class="board"></div></div><div class="actions"><button id="resetBtn">最初から</button><button id="rulesBtn">ルール</button><button id="hintBtn" class="hint">ヒント</button></div></section><div id="toast" class="toast"></div></main>
<dialog id="dlg"><div class="dialog"><h2 id="dlgTitle"></h2><div id="dlgBody"></div><div id="dlgActions"></div></div></dialog>
<dialog id="storyDlg" class="story-dialog"><div class="story"><div id="storyArt" class="story-art"></div><div id="storyPage" class="story-page"></div><h2 id="storyTitle"></h2><p id="storyText"></p><button id="storyNext" class="primary">次へ</button></div></dialog>
<dialog id="historyDlg"><div class="dialog"><h2>過去のステージ</h2><div id="historyGrid" class="history-grid"></div><button id="historyClose" class="primary">閉じる</button></div></dialog>
<dialog id="debugDlg"><div class="dialog"><h2>DEBUG</h2><div class="debug-grid"><button id="dbgHeart">ハート全回復</button><button id="dbgKibble">カリカリ +10</button><button id="dbgClear">現在ステージをクリア</button><button id="dbgUnlock">全ステージ解放</button><button id="dbgAnswer">正解位置を表示</button><button id="dbgLog">操作履歴を表示</button><button id="dbgStory">導入を再表示</button><button id="dbgReset">進行データ初期化</button></div><pre id="debugLog"></pre><button id="debugClose" class="primary">閉じる</button></div></dialog>
<script src="game.js"></script></body></html>
