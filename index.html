<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ねこみちロジック Ver.0.7.3</title><link rel="stylesheet" href="style.css"></head><body><section id="titleScreen" class="title-screen" aria-label="タイトル画面">
  <div class="title-sky"><i></i><i></i><i></i></div>
  <div class="title-card">
    <small class="title-brand">TEKO GAMES</small>
    <div class="title-logo"><span class="title-paw">●</span><h1>ねこみち<br><b>ロジック</b></h1></div>
    <p>やさしい猫のロジックパズル</p>
    <div class="title-path" aria-hidden="true"><span></span><span></span><span></span></div>
    <div class="title-actions">
      <button id="titleContinue" class="title-primary">つづきから</button>
      <button id="titleStages">ステージ選択</button>
      <button id="titleNew">最初から</button><button id="titleSettings">設定</button>
    </div>
    <small class="title-version">Ver.0.7.3 prototype</small>
  </div>
</section>
<main class="app"><header><div><small>TEKO GAMES</small><h1>ねこみちロジック</h1><p>やさしい猫のロジックパズル <small>Ver.0.7.3</small></p></div><div class="head-actions"><button id="debugOpen" class="debug-mini">DEBUG</button><button id="catsBtn" class="cats-mini" aria-label="出会った猫">🐾</button><button id="settingsBtn" class="settings-mini" aria-label="設定">⚙</button><button id="historyBtn" class="history-top hidden" hidden>過去ステージ</button><button id="stageSelectBtn" class="stagebox" aria-label="ステージ選択を開く"><b id="stageLabel">STAGE 1</b><span id="scoreLabel">評価 0 / 100</span><small>ステージ選択</small></button></div></header>
<section id="talk" class="talk left"><span id="talkFace" class="face">🐱</span><div class="bubble"><b id="talkName">にゃんこ爺さん</b><p id="talkText"></p></div></section>
<section id="bossBanner" class="boss-banner hidden" aria-live="polite"><span class="boss-paw">🐾</span><div><small>STAGE 50 BOSS</small><b id="bossPhaseLabel">第1フェーズ　足あとを追う</b></div><span id="bossPhaseCount">1 / 3</span></section>
<section id="panel" class="panel"><div class="meta"><div id="lifeBox"></div><div class="marks mark-cycle"><label>MARK <small>タップで切替</small></label><button id="modeCycle" class="active" aria-label="マーク切り替え" title="タップで × → ？ → △">×</button></div></div><div id="operationGuide" class="operation-guide hidden" aria-label="操作方法"><span><b>1回タップ</b> ×</span><span><b>素早く2回</b> 猫を開く</span><span><b>MARK</b> タップで切替</span><span><b>なぞる</b> 連続で×</span></div><div id="coordTop" class="coord-top"></div><div class="boardrow"><div id="coordSide" class="coord-side"></div><div id="board" class="board"></div></div><div id="hintDock" class="hint-dock hidden" aria-label="仲間の助け"><button data-hint="toy"><span class="hint-info" data-info="toy" role="button" aria-label="効果を見る">?</span><span class="hint-icon">🪶</span><b>猫じゃらし</b><small>カリカリ1</small></button><button data-hint="matatabi"><span class="hint-info" data-info="matatabi" role="button" aria-label="効果を見る">?</span><span class="hint-icon">🌿</span><b>またたび</b><small>カリカリ2</small></button><button data-hint="can"><span class="hint-info" data-info="can" role="button" aria-label="効果を見る">?</span><span class="hint-icon">🥫</span><b>ネコ缶</b><small>カリカリ3</small></button><button data-hint="paw"><span class="hint-info" data-info="paw" role="button" aria-label="効果を見る">?</span><span class="hint-icon">🐾</span><b>肉球チェック</b><small>カリカリ2</small></button></div></section><div id="toast" class="toast"></div></main>
<dialog id="dlg"><div class="dialog"><h2 id="dlgTitle"></h2><div id="dlgBody"></div><div id="dlgActions"></div></div></dialog>
<dialog id="storyDlg" class="story-dialog"><div class="story"><div id="storyArt" class="story-art"></div><div id="storyPage" class="story-page"></div><h2 id="storyTitle"></h2><p id="storyText"></p><button id="storyNext" class="primary">次へ</button></div></dialog>
<dialog id="historyDlg"><div class="dialog history-dialog-body"><div class="history-sticky"><h2>過去のステージ</h2><button id="historyClose" class="history-close" aria-label="閉じる">× 閉じる</button></div><div id="historyGrid" class="history-grid"></div></div></dialog>
<dialog id="debugDlg"><div class="dialog"><h2>DEBUG</h2><div class="debug-grid"><button id="dbgHeart">ハート全回復</button><button id="dbgKibble">カリカリ +10</button><button id="dbgClear">現在ステージをクリア</button><button id="dbgUnlock">全ステージ解放</button><button id="dbgAnswer">正解位置を表示</button><button id="dbgLog">操作履歴を表示</button><button id="dbgStory">導入を再表示</button><button id="dbgReset">進行データ初期化</button></div><pre id="debugLog"></pre><button id="debugClose" class="primary">閉じる</button></div></dialog>
<script src="stages.js"></script><script src="logic-engine.js"></script><script src="hint-engine.js"></script><script src="quality-engine.js"></script><script src="analysis-engine.js"></script><script src="assumption-engine.js"></script><script src="difficulty-manager.js"></script><script src="stage-generator.js"></script><dialog id="catsDlg" class="cats-dialog"><div class="dialog"><button id="catsClose" class="xclose" aria-label="閉じる">×</button><h2>出会った猫</h2><p class="cats-lead">旅の中で本当の仲間になった猫たちです。</p><div id="catsList" class="cats-list"></div></div></dialog><script src="stories.js"></script><script src="game.js"></script></body></html>
