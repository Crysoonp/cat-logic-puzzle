<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Cat Logic Puzzle Ver.0.5.0</title><link rel="stylesheet" href="style.css"></head><body>
<main class="app"><header><div><small>TEKO GAMES</small><h1>Cat Logic Puzzle</h1><p>Ver.0.5.0 prototype</p></div><div class="head-actions"><button id="debugOpen" class="debug-mini">DEBUG</button><button id="settingsBtn" class="settings-mini" aria-label="設定">⚙</button><button id="historyBtn" class="history-top hidden">過去ステージ</button><div class="stagebox"><b id="stageLabel">STAGE 1</b><span id="scoreLabel">100点</span></div></div></header>
<section id="talk" class="talk left"><span id="talkFace" class="face">🐱</span><div class="bubble"><b id="talkName">にゃんこ爺さん</b><p id="talkText"></p></div></section>
<section id="bossBanner" class="boss-banner hidden" aria-live="polite"><span class="boss-paw">🐾</span><div><small>STAGE 50 BOSS</small><b id="bossPhaseLabel">第1フェーズ　足あとを追う</b></div><span id="bossPhaseCount">1 / 3</span></section>
<section id="panel" class="panel"><div class="meta"><div id="lifeBox"></div><div class="marks"><label>MARK</label><button id="modeX" class="active">×</button><button id="modeQ">？</button><button id="modeT" class="hidden">△</button></div></div><div id="coordTop" class="coord-top"></div><div class="boardrow"><div id="coordSide" class="coord-side"></div><div id="board" class="board"></div></div><div class="hint-dock" aria-label="ヒントアイテム"><button data-hint="toy"><span class="hint-info" data-info="toy" role="button" aria-label="効果を見る">?</span><span class="hint-icon">🪶</span><b>猫じゃらし</b><small>カリカリ1</small></button><button data-hint="matatabi"><span class="hint-info" data-info="matatabi" role="button" aria-label="効果を見る">?</span><span class="hint-icon">🌿</span><b>またたび</b><small>カリカリ2</small></button><button data-hint="can"><span class="hint-info" data-info="can" role="button" aria-label="効果を見る">?</span><span class="hint-icon">🥫</span><b>ネコ缶</b><small>カリカリ3</small></button><button data-hint="paw"><span class="hint-info" data-info="paw" role="button" aria-label="効果を見る">?</span><span class="hint-icon">🐾</span><b>肉球チェック</b><small>カリカリ2</small></button></div></section><div id="toast" class="toast"></div></main>
<dialog id="dlg"><div class="dialog"><h2 id="dlgTitle"></h2><div id="dlgBody"></div><div id="dlgActions"></div></div></dialog>
<dialog id="storyDlg" class="story-dialog"><div class="story"><div id="storyArt" class="story-art"></div><div id="storyPage" class="story-page"></div><h2 id="storyTitle"></h2><p id="storyText"></p><button id="storyNext" class="primary">次へ</button></div></dialog>
<dialog id="historyDlg"><div class="dialog history-dialog-body"><div class="history-sticky"><h2>過去のステージ</h2><button id="historyClose" class="history-close" aria-label="閉じる">× 閉じる</button></div><div id="historyGrid" class="history-grid"></div></div></dialog>
<dialog id="debugDlg"><div class="dialog"><h2>DEBUG</h2><div class="debug-grid"><button id="dbgHeart">ハート全回復</button><button id="dbgKibble">カリカリ +10</button><button id="dbgClear">現在ステージをクリア</button><button id="dbgUnlock">全ステージ解放</button><button id="dbgAnswer">正解位置を表示</button><button id="dbgLog">操作履歴を表示</button><button id="dbgStory">導入を再表示</button><button id="dbgReset">進行データ初期化</button></div><pre id="debugLog"></pre><button id="debugClose" class="primary">閉じる</button></div></dialog>
<script src="stages.js"></script><script src="logic-engine.js"></script><script src="hint-engine.js"></script><script src="quality-engine.js"></script><script src="analysis-engine.js"></script><script src="assumption-engine.js"></script><script src="difficulty-manager.js"></script><script src="stage-generator.js"></script><script src="game.js"></script></body></html>
